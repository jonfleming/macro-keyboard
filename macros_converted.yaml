orientation: normal

rows: 3
columns: 4
knobs: 3

layers:
  - buttons:
      - ["shift-a,m,i,c,u,s,dot,4,4,Enter", "j,o,n,Tab,shift-a,m,i,c,u,s,dot,4,4,Enter", "shift-r,a,s,p,b,e,r,r,y,space,shift-p,i", "h,o,m,e,Enter,c,l,s,Enter"]
      - ["3,3,9,3", "t,e,s,t", "g", "h"]
      - ["s,s,h,space,p,i,shift-2,1,0,dot,0,dot,0,dot,2", "j", "k", "l"]
    knobs:
      - ccw: "Previous"
        gpress: "Play"
        cw: "Next"
      - ccw: "Win-Left"
        press: "Calculator"
        cw: "Win-Right"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  - buttons:
      - ["Escape", "w", "e", "r"]
      - ["a", "s", "d", "f"]
      - ["shift", "z", "x", "c"]
    knobs:
      - ccw: "Left"
        press: "Home"
        cw: "Right"
      - ccw: "Ctrl-Left"
        press: "End"
        cw: "Ctrl-Right"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  - buttons:
      - ["F1", "F2", "F3", "F4"]
      - ["F5", "F6", "F7", "F8"]
      - ["F9", "F10", "F11", "F12"]
    knobs:
      - ccw: "Left"
        press: "Home"
        cw: "Right"
      - ccw: "Ctrl-Left"
        press: "End"
        cw: "Ctrl-Right"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

