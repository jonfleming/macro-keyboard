model: ch57x-1
orientation: normal

rows: 3
columns: 4
knobs: 3

layers:
  - buttons:
      - ["shift-a,m,i,c,u,s,dot,4,4,enter", "j,o,n,tab,shift-a,m,i,c,u,s,dot,4,4,enter", "shift-r,a,s,p,b,e,r,r,y,space,shift-p,i", "h,o,m,e,enter,c,l,s,enter"]
      - ["e", "f", "g", "h"]
      - ["ctrl-b", "alt-b", "backspace", "delete"]
    knobs:
      - ccw: "previous"
        press: "play"
        cw: "next"
      - ccw: "win-left"
        press: "calculator"
        cw: "win-right"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  - buttons:
      - ["escape", "w", "e", "r"]
      - ["a", "s", "d", "f"]
      - ["shift", "z", "x", "c"]
    knobs:
      - ccw: "left"
        press: "home"
        cw: "right"
      - ccw: "ctrl-left"
        press: "end"
        cw: "ctrl-right"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  - buttons:
      - ["f1", "f2", "f3", "f4"]
      - ["f5", "f6", "f7", "f8"]
      - ["f9", "f10", "f11", "f12"]
    knobs:
      - ccw: "left"
        press: "home"
        cw: "right"
      - ccw: "ctrl-left"
        press: "end"
        cw: "ctrl-right"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"
